version: "3.9"

services:
  app:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: neon-ai
    environment:
      - WEBUI_HOST=0.0.0.0
    ports:
      - "3000:3000"
    volumes:
      - ../../models:/app/models:rw
      - ../../src/config:/app/src/config:ro
    command: ["python", "-m", "src.main"]

  ollama:
    image: ollama/ollama:latest
    container_name: neon-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    # TODO: add resource limits, healthchecks, and persistence rules

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: neon-open-webui
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - OLLAMA_API_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
    # TODO: mount custom UI settings and authentication config

volumes:
  ollama-models:
