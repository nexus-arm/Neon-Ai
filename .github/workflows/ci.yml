name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Smoke check
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              Path("deploy/deploy_cybersec_enhanced.py"),
              Path("deploy/docker/docker-compose.yml"),
              Path("docs/README.md"),
          ]
          missing = [str(p) for p in required if not p.exists()]
          if missing:
              raise SystemExit(f"Missing required files: {', '.join(missing)}")
          print("Repository layout looks good.")
          PY
